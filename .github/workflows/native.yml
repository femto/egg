name: Native

# eggc and clutch compiled to native binaries by Spinel, on each platform a
# release ships for: tools/dist.rb builds them with the standard library
# beside them, and tools/native_check.rb checks that the native eggc says
# exactly what eggc on Ruby says. The release workflow runs this with
# `release: true` and publishes the archives.

# It takes a while (Windows compiles eggc for ~17 minutes), so it does not
# run on every change to the compiler: on a release (workflow_call), by
# hand, once a week on main (so that something Spinel cannot compile shows
# up well before a release), and on pull requests that change how the
# binaries are built, found or installed.
on:
  pull_request:
    paths:
      - "tools/dist.rb"
      - "tools/native_check.rb"
      - "lib/egg/home.rb"
      - "install.sh"
      - "install.ps1"
      - ".github/workflows/native.yml"
      - ".github/workflows/release.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Keep the archives for a release
        type: boolean
        default: false

permissions:
  contents: read

env:
  # The Spinel that builds the release; bump it on purpose.
  SPINEL_REPO: matz/spinel
  SPINEL_SHA: 18b153ebf2c629c468a29dd26753f66a75b475e4

jobs:
  unix:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x86_64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
          - { os: macos-latest, platform: macos-arm64 }
          - { os: macos-15-intel, platform: macos-x86_64 }
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: "3.3"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ env.SPINEL_REPO }}
          ref: ${{ env.SPINEL_SHA }}
          path: spinel
          persist-credentials: false
      - name: Build Spinel
        working-directory: spinel
        run: make deps && make -j4
      - name: Build eggc and clutch
        run: ruby tools/dist.rb --spinel spinel/bin/spinel --platform ${{ matrix.platform }}
      - name: The native eggc says what eggc on Ruby says
        run: ruby tools/native_check.rb dist/egg-*-${{ matrix.platform }}/bin/eggc
      - name: The tests, with the native eggc and clutch as the commands
        run: |
          dir=$(echo dist/egg-*-${{ matrix.platform }})
          EGGC="$PWD/$dir/bin/eggc" CLUTCH="$PWD/$dir/bin/clutch" ruby test/run.rb
      - name: install.sh installs it, and it runs from there
        run: |
          cd dist && shasum -a 256 egg-*.tar.gz > SHA256SUMS && cd ..
          version=$(ruby -e 'require "./lib/egg/home"; require "./lib/egg/version"; print Egg::VERSION')
          mkdir -p "$RUNNER_TEMP/home"
          HOME="$RUNNER_TEMP/home" EGG_VERSION=$version EGG_HOME="$RUNNER_TEMP/egg" EGG_DOWNLOAD_BASE="file://$PWD/dist" sh install.sh
          # A new shell finds eggc through the startup files install.sh wrote.
          HOME="$RUNNER_TEMP/home" bash -lc 'eggc --version'
          export PATH="$RUNNER_TEMP/egg/bin:$PATH"
          cd "$RUNNER_TEMP" && clutch new --lib smoke && cd smoke && clutch test
      - if: inputs.release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: egg-${{ matrix.platform }}
          path: dist/egg-*-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  windows:
    name: windows-x86_64
    runs-on: windows-latest
    # Compiling eggc's C takes MinGW's gcc about 17 minutes here.
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - run: git config --global core.autocrlf false
        shell: bash
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ env.SPINEL_REPO }}
          ref: ${{ env.SPINEL_SHA }}
          path: spinel
          persist-credentials: false
      # Spinel's native Windows build (its docs/windows.md): MSYS2's UCRT64
      # gcc, and Ruby for its generators and for eggc on Ruby.
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        id: msys2
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          install: make diffutils curl tar git zip mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-ruby
      - name: Build Spinel
        working-directory: spinel
        # The compiler, its runtime, and the bundled packages eggc and clutch
        # link (json, tmpdir, ...); not all of `make`, which Windows lacks
        # some of (pty).
        run: |
          pkgs="json tmpdir stringio strscan base64"
          objs=$(for p in $pkgs; do printf 'packages/%s/sp_%s.o packages/%s/sp_%s_mt.o ' $p $p $p $p; done)
          make deps && make -j4 bin/spinel lib/libspinel_rt.a lib/libspinel_rt_mt.a $objs
      - name: Build eggc and clutch
        run: ruby tools/dist.rb --spinel spinel/bin/spinel --platform windows-x86_64
      - name: The native eggc says what eggc on Ruby says
        run: ruby tools/native_check.rb dist/egg-*-windows-x86_64/bin/eggc.exe
      - name: Sums for the install test
        run: cd dist && sha256sum egg-*.zip > SHA256SUMS
      - name: install.ps1 installs it, and it runs from there
        shell: pwsh
        env:
          CC: gcc
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $version = (Get-Content lib/egg/version.rb | Select-String 'VERSION = "(.*)"').Matches[0].Groups[1].Value
          $env:EGG_VERSION = $version
          $env:EGG_HOME = Join-Path $env:RUNNER_TEMP "egg"
          $env:EGG_DOWNLOAD_BASE = ([Uri](Resolve-Path dist).Path).AbsoluteUri
          ./install.ps1
          $env:Path = (Join-Path $env:EGG_HOME "bin") + ";" + (Join-Path $env:MSYS2_LOCATION "ucrt64\bin") + ";" + $env:Path
          Set-Location $env:RUNNER_TEMP
          clutch new --lib smoke
          Set-Location smoke
          clutch test
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - if: inputs.release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: egg-windows-x86_64
          path: dist/egg-*-windows-x86_64.zip
          if-no-files-found: error
