name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Windows is new: it reports what fails without blocking a merge.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CC: ${{ matrix.os == 'windows-latest' && 'gcc' || 'cc' }}
    steps:
      # The tests compare exact source lines, so no CRLF on checkout.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: "3.3"
      - run: cc --version || gcc --version
        shell: bash
      - run: ruby test/run.rb
